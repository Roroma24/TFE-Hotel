{% extends 'base.html' %} {% block title %}Plaza Delfino | Iniciar sesión{%
endblock %} {% block content %}
<section class="admin-login-wrap">
  <div class="admin-login-card">
    <p class="eyebrow">Acceso</p>
    <h1>Iniciar sesión</h1>
    <p class="admin-login-text">
      Accede para gestionar o continuar con tu reserva.
    </p>

    {% if error %}
    <div class="form-error-box">{{ error }}</div>
    {% endif %}

    <form method="post" class="admin-form">
      <div class="form-group">
        <label>Correo electrónico</label>
        <input type="email" name="correo" required />
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required />
      </div>

      <button type="submit" class="btn-main full-button">Iniciar sesión</button>
    </form>
  </div>
</section>
{% endblock %} ```
