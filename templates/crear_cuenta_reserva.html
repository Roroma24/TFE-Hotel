{% extends 'base.html' %} {% block title %}Plaza Delfino | Crear cuenta{%
endblock %} {% block content %}
<section class="booking-top">
  <div class="container">
    <h1>Crear cuenta</h1>
    <p>Ingrese sus datos básicos para continuar.</p>
  </div>
</section>

<section>
  <div class="container booking-layout">
    <div class="booking-panel">
      <p class="eyebrow">Segundo paso</p>
      <h2>Datos de acceso para su reserva</h2>

      {% if error %}
      <div class="error-message">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1">
            <label>Nombre completo</label>
            <input type="text" name="nombre" required />
          </div>

          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" name="email" required />
          </div>

          <div class="form-group">
            <label>Teléfono</label>
            <input type="text" name="telefono" required />
          </div>

          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required />
          </div>

          <div class="form-group">
            <label>Documento de identidad</label>
            <input type="text" name="documento_identidad" />
          </div>

          <div class="form-group" style="grid-column: 1 / -1">
            <label>Dirección</label>
            <input type="text" name="direccion" />
          </div>

          <div class="form-group" style="grid-column: 1 / -1">
            <label>Empresa (opcional)</label>

            <select name="id_empresa">
              <option value="">Sin empresa</option>

              {% for empresa in empresas %}
              <option value="{{ empresa.id_empresa }}">
                {{ empresa.nombre_empresa }}
              </option>
              {% endfor %}
            </select>
          </div>
        </div>

        <button
          type="submit"
          class="btn-main full-button"
          style="margin-top: 20px"
        >
          Continuar
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %} ```
